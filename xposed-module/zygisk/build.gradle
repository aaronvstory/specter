plugins {
    id 'com.android.library'
}

// Builds libspecter_zygisk.so (the Zygisk native layer). It is NOT an app — the .so is extracted from
// the AAR by build-zygisk.sh and packaged into a flashable Magisk/Zygisk module zip. NDK/CMake wiring
// mirrors :probe (the proven native-build setup on this box).
android {
    namespace 'com.specter.zygisk'
    compileSdk 36
    ndkVersion "27.0.12077973"
    defaultConfig {
        minSdk 24
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {} }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
    lint { checkReleaseBuilds false; abortOnError false }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No external native deps: ZygiskNext's builtin linker loads only self-contained module .so files
// ("open module with builtin linker failed: not preloaded" if it has a DT_NEEDED it can't resolve).
// So the inline hooker (And64InlineHook, single-file, MIT) is compiled straight into our one .so.
