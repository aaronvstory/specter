plugins {
    id 'com.android.application'
}

// Specter verification probe: a tiny app that reads every spoofable Android API and dumps the actual
// returned values to /data/local/tmp/specter/probe_result.json. Specter scopes it like any target app,
// so the file reflects exactly what a real app sees through the hooks — a deterministic, no-UI verifier.
android {
    namespace 'com.specter.probe'
    compileSdk 36
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.specter.probe"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {} }
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
    lint { checkReleaseBuilds false; abortOnError false }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // GMS Fused location — the probe reads getLastLocation() the same way a real app (incl. Dasher) does,
    // so the verifier can prove Specter's Fused hook returns the profile fix. Raw LocationManager needs no dep.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
