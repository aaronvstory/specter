plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fleet.idrotate'
    compileSdk 36
    defaultConfig {
        applicationId "com.fleet.idrotate"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "0.3.0"
    }
    lint { checkReleaseBuilds false; abortOnError false }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API stubs — compileOnly, LSPosed provides the real impl at runtime.
    compileOnly files('libs/xposed-api-stub.jar')
}
