plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fleet.idrotate'
    compileSdk 34

    defaultConfig {
        applicationId "com.fleet.idrotate"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API is compileOnly — provided by the LSPosed framework at runtime.
    compileOnly 'de.robv.android.xposed:api:82'
    // org.json ships with Android; no extra dep needed.
}
