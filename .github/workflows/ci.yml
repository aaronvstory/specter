name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        # JVM + device tests skip automatically when no JDK / no adb device is present in CI.
        run: uv run --with pytest --with rich python -m pytest -q
