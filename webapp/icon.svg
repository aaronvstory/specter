<!-- Specter's mark: the gold ghost from the Android launcher glyph
     (xposed-module/app/src/main/res/drawable/ic_launcher_foreground.xml), on the same #16161A.
     ONE source for every raster below it — webapp/make-icons.py rasterises this file, so the tab icon, the
     home-screen icon and the app icon cannot drift apart. -->
