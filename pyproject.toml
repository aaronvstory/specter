[project]
name = "specter"
version = "0.2.0"
description = "Per-app device identity rotation for Android — coherent, never-reused fingerprints per signup"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "rich>=13.7.0",
    "questionary>=2.0.0",
]

[project.scripts]
specter = "specter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
